<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargando...</title>
    <style>
      /* Estilos base */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #763055; /* Fondo oscuro */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* Contenedor del spinner */
      .loader {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1); /* Borde claro/transparente */
        border-top-color: #38bdf8; /* Color de la parte que gira (Azul) */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* Animación de rotación */
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Círculo de carga -->
    <div class="loader"></div>
    <script>
      window.location.href = "./frontend/index.html";
    </script>
  </body>
</html>
