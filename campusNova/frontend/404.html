<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada | NOVACAMPUS</title>
    <meta name="theme-color" content="#1b396a">
    <link rel="icon" href="/img/logo-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Rutas absolutas: NGINX sirve esta página para cualquier URL inexistente, incluso en subrutas -->
    <link rel="stylesheet" href="/css/index.css" />
    <style>
      .nf { flex: 1; display: grid; place-items: center; padding: 3rem var(--gutter); text-align: center;
        background: radial-gradient(40rem 24rem at 50% 0%, rgba(201,150,43,.16), transparent 70%), var(--bg); }
      .nf-code { font-family: var(--font-display); font-weight: 700; font-size: clamp(6rem, 22vw, 11rem); line-height: .9; letter-spacing: -0.05em;
        color: var(--brand-700); display: inline-flex; align-items: center; gap: .02em; }
      .nf-code img { width: .72em; height: .72em; filter: none; animation: float 3.2s ease-in-out infinite; }
      .nf h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 600; margin: 1.25rem 0 .6rem; }
      .nf p { color: var(--muted); max-width: 44ch; margin: 0 auto 2rem; }
      @keyframes float { 50% { transform: translateY(-8px) rotate(-4deg); } }
    </style>
</head>
<body>
    <main class="nf">
      <div>
        <div class="nf-code" aria-hidden="true">4<img src="/img/logo-mark.png" alt="" />4</div>

</body>
