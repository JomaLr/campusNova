<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración - NOVACAMPUS</title>
    <meta name="description" content="Panel de administración de la plataforma NOVACAMPUS.">
    <meta name="author" content="Equipo campusNova">
    <meta name="theme-color" content="#1b396a">
    <link rel="icon" href="img/logo-mark.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/index.css" />
    <!-- Supabase: configuración, librería y scripts de la página -->
    <script src="js/config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/ui.js" defer></script>
    <script src="js/dashboard.js" defer></script>
  </head>
  <body class="dash-body">
    <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>
    <header class="dashboard-header">
      <div class="container bar">
        <a class="brand" href="index.html" aria-label="Ir al sitio público">
          <span class="brand-mark"><img src="img/logo-mark.png" alt="" width="28" height="28" /></span>
          <span class="brand-text"><strong>NOVACAMPUS</strong><small class="dash-title">Panel de Control</small></span>
        </a>
        <div class="dash-user">
          <span class="avatar" id="avatar-usuario" aria-hidden="true">N</span>
          <span id="info-usuario"></span>
          <button id="btn-cerrar-sesion" class="btn btn-danger btn-sm" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-log-out"></use></svg><span class="btn-label-hide">Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container dash-main" id="contenido-principal" tabindex="-1">
      <div class="dash-intro">
        <span class="eyebrow">Administración</span>
        <h1 class="section-title" style="margin-top: .5rem">Panel de Control</h1>
      </div>

      <div class="stats" id="stats" aria-label="Resumen de publicaciones">
        <div class="stat"><span class="s-icon"><svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg></span><div><strong id="stat-total">–</strong><span class="s-label">Publicaciones</span></div></div>
        <div class="stat stat--aviso"><span class="s-icon"><svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg></span><div><strong id="stat-aviso">–</strong><span class="s-label">Avisos</span></div></div>
        <div class="stat stat--evento"><span class="s-icon"><svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg></span><div><strong id="stat-evento">–</strong><span class="s-label">Eventos</span></div></div>
        <div class="stat stat--noticia"><span class="s-icon"><svg class="icon" aria-hidden="true"><use href="#i-newspaper"></use></svg></span><div><strong id="stat-noticia">–</strong><span class="s-label">Noticias</span></div></div>
      </div>

      <div class="dashboard-grid">
        <!-- Formulario de Creación / Edición -->
        <div class="content-card form-card" id="tarjeta-form">
          <h3 id="form-titulo">Crear Nueva Publicación</h3>

          <form id="form-publicacion" onsubmit="return false;">
            <div class="form-group">
              <label for="titulo">Título *</label>
              <input
                type="text"
                id="titulo"
                placeholder="Ej: Conferencia de Tecnología"
                required
              />
            </div>

            <div class="form-group">
              <label for="contenido">Contenido / Descripción *</label>
              <textarea
                id="contenido"
                rows="4"
                placeholder="Escribe el detalle de la publicación..."
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label for="tipo-pub">Tipo de Publicación</label>
              <select id="tipo-pub">
                <option value="Aviso">Aviso</option>
                <option value="Evento">Evento</option>
                <option value="Noticia">Noticia</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fecha-inicio">Fecha de Inicio del Evento</label>
              <input type="datetime-local" id="fecha-inicio" />
            </div>

            <div class="form-group">
              <label for="lugar">Lugar / Salón</label>
              <select id="lugar">
                <option value="">Cargando salones...</option>
              </select>
            </div>

            <div class="form-group" id="grupo-departamento" style="display: none">
              <label for="select-departamento">Asignar a Departamento (Superusuario)</label>
              <select id="select-departamento"></select>
            </div>

            <div class="form-actions">
              <button type="button" id="btn-publicar" class="btn btn-primary">
                Guardar Publicación
              </button>
              <button type="button" id="btn-cancelar" class="btn btn-ghost" style="display: none">
                Cancelar
              </button>
            </div>
          </form>
        </div>

        <!-- Tabla de Publicaciones -->
        <div>
          <div class="table-head">
            <h3>Publicaciones Registradas</h3>
            <span id="conteo-tabla"></span>
          </div>
          <div class="admin-table-container">
            <div class="table-scroll">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th scope="col">Título</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Fecha Inicio</th>
                    <th scope="col">Lugar</th>
                    <th scope="col">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tabla-publicaciones">
                  <tr>
                    <td colspan="5">Cargando publicaciones...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
